name: Audit isolato aggiornamento G13 da Dropbox
on:
  push:
    branches:
      - test/snapshot-g13-dropbox-20261125
    paths:
      - beta/data-v13.js
      - beta/wallet-excel-g12-g13.js
      - prototypes/lineups/test-g13-snapshot.cjs
      - prototypes/lineups/test-g13-browser.cjs
      - .github/workflows/g13-snapshot-audit.yml

permissions:
  contents: read

jobs:
  verifica-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Leggi solo il ramo di prova
        uses: actions/checkout@v4
      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica sintassi JavaScript
        run: |
          node --check beta/data-v13.js
          node --check beta/wallet-excel-g12-g13.js
      - name: Testa risultati, formazioni, pronostici congelati e schedine
        run: node --test prototypes/lineups/test-g13-snapshot.cjs
      - name: Installa Playwright per test browser
        run: npm install --no-fund --no-audit --no-save playwright@1.56.1
      - name: Verifica navigazione su iPhone e desktop
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          else
            npx playwright install chromium
          fi
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/site-g13.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node prototypes/lineups/test-g13-browser.cjs
