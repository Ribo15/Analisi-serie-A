name: Aggiorna formazioni dal telefono (TEST)
run-name: Aggiornamento manuale formazioni - solo ramo test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lineups-experimental-only
  cancel-in-progress: false

jobs:
  aggiorna-ramo-test:
    name: Valida e aggiorna SOLO il ramo sperimentale
    if: github.repository == 'Ribo15/Analisi-serie-A' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Usa il ramo sperimentale, non il sito principale
        uses: actions/checkout@v4
        with:
          ref: test/aggiornamento-formazioni-isolato
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Verifica disponibilita della fonte
        run: python prototypes/lineups/probe_source.py

      - name: Estrai e verifica le 10 formazioni
        run: python prototypes/lineups/extract_lineups.py

      - name: Verifica compatibilita Excel e ripristino in caso di errore
        run: |
          node --check prototypes/lineups/lineups-client.js
          node --check app.js
          node --test prototypes/lineups/test-client.cjs

      - name: Pubblica SOLO il JSON sul ramo sperimentale
        run: |
          cp lineups-preview.json prototypes/lineups/lineups-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prototypes/lineups/lineups-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test: aggiorna formazioni via iPhone [skip ci]"
            git push origin HEAD:refs/heads/test/aggiornamento-formazioni-isolato
          fi
          echo "### Formazioni aggiornate SOLO sul ramo sperimentale" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sito principale: nessuna modifica" >> "$GITHUB_STEP_SUMMARY"
          echo "- Excel, pronostici e fasce: nessuna modifica" >> "$GITHUB_STEP_SUMMARY"
          echo "- Controlli: completati prima della pubblicazione" >> "$GITHUB_STEP_SUMMARY"

      - name: Conserva esito diagnostico per controllo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esito-aggiornamento-formazioni-test
          path: |
            lineups-probe-report.json
            lineups-validation.json
            lineups-preview.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Comunica errore senza aggiornare i dati
        if: failure()
        run: |
          echo "### Aggiornamento non riuscito" >> "$GITHUB_STEP_SUMMARY"
          echo "Nessun nuovo JSON pubblicato; il sito principale e i dati Excel sono invariati." >> "$GITHUB_STEP_SUMMARY"
