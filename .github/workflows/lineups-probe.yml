name: Test isolato fonte formazioni
on:
  push:
    branches:
      - test/aggiornamento-formazioni-isolato
    paths:
      - "prototypes/lineups/*.py"
      - "prototypes/lineups/*.js"
      - "prototypes/lineups/*.cjs"
      - ".github/workflows/lineups-probe.yml"

permissions:
  contents: write

jobs:
  verifica-fonte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Leggi codice del ramo sperimentale
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla accessibilita e struttura della fonte
        run: python prototypes/lineups/probe_source.py
      - name: Installa parser HTML minimo
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Estrai e valida JSON temporaneo
        run: python prototypes/lineups/extract_lineups.py
      - name: Verifica compatibilita con snapshot Excel e fallback
        run: |
          node --check prototypes/lineups/lineups-client.js
          node --check app.js
          node --test prototypes/lineups/test-client.cjs
      - name: Installa Playwright per test browser
        run: npm install --no-fund --no-audit --no-save playwright@1.56.1
      - name: Verifica rendering su iPhone e desktop
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          else
            npx playwright install chromium
          fi
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/lineups-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node prototypes/lineups/browser-smoke.cjs
      - name: Pubblica il solo JSON validato sul ramo di prova
        if: success() && github.ref == 'refs/heads/test/aggiornamento-formazioni-isolato'
        run: |
          cp lineups-preview.json prototypes/lineups/lineups-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/lineups/lineups-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test: aggiorna snapshot formazioni verificato [skip ci]"
            git push origin HEAD:refs/heads/test/aggiornamento-formazioni-isolato
          fi
      - name: Salva solo report diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineups-source-probe
          path: |
            lineups-probe-report.json
            lineups-validation.json
            lineups-preview.json
            prototypes/lineups/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
